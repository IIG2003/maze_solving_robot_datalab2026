#VRML_SIM R2025a utf8
# TwoWheelRobot.proto - minimal differential-drive robot base for teams to
# customize. Chassis, wheels, motors, caster and physics are fixed/locked;
# teams may only change cosmetic fields and add their own sensors/parts
# through "extensionSlot" without touching the drivetrain itself.
# supervisor is hardcoded FALSE and not exposed, so it cannot be enabled.

PROTO TwoWheelRobot [
  field SFVec3f    translation    0 0 0
  field SFRotation rotation       0 0 1 0
  field SFString   name           "TwoWheelRobot"
  field SFString   controller     "<none>"
  field MFString   controllerArgs []
  field SFColor    bodyColor      0.15 0.15 0.6
  field MFNode     extensionSlot  [
    # ===== Team sensor suite (added only through the extension slot) =====
    # Frame: +x forward, +y left, +z up. Sensors carry no boundingObject and
    # no physics, so the locked collision geometry and mass are unchanged.
    # All distance sensors return METRES via the lookup table (0.5 = no hit).
    # Mounted at z = 0.05 (chassis top = 0.055, wheel top = 0.04, cubes and
    # walls are 0.10 tall, so every beam sees them).

    # --- Front fan: 5 beams, 15 degrees apart ---
    DistanceSensor {
      translation 0.04 0 0.05
      name "ds_f0"
      type "laser"
      lookupTable [ 0 0 0, 0.5 0.5 0 ]
      children [
        Shape {
          appearance PBRAppearance { baseColor 0.1 0.8 0.9 roughness 1 metalness 0 }
          geometry Box { size 0.006 0.006 0.006 }
        }
      ]
    }
    DistanceSensor {
      translation 0.04 0.01 0.05
      rotation 0 0 1 0.2618
      name "ds_fl15"
      type "laser"
      lookupTable [ 0 0 0, 0.5 0.5 0 ]
      children [
        Shape {
          appearance PBRAppearance { baseColor 0.1 0.8 0.9 roughness 1 metalness 0 }
          geometry Box { size 0.006 0.006 0.006 }
        }
      ]
    }
    DistanceSensor {
      translation 0.04 0.02 0.05
      rotation 0 0 1 0.5236
      name "ds_fl30"
      type "laser"
      lookupTable [ 0 0 0, 0.5 0.5 0 ]
      children [
        Shape {
          appearance PBRAppearance { baseColor 0.1 0.8 0.9 roughness 1 metalness 0 }
          geometry Box { size 0.006 0.006 0.006 }
        }
      ]
    }
    DistanceSensor {
      translation 0.04 -0.01 0.05
      rotation 0 0 1 -0.2618
      name "ds_fr15"
      type "laser"
      lookupTable [ 0 0 0, 0.5 0.5 0 ]
      children [
        Shape {
          appearance PBRAppearance { baseColor 0.1 0.8 0.9 roughness 1 metalness 0 }
          geometry Box { size 0.006 0.006 0.006 }
        }
      ]
    }
    DistanceSensor {
      translation 0.04 -0.02 0.05
      rotation 0 0 1 -0.5236
      name "ds_fr30"
      type "laser"
      lookupTable [ 0 0 0, 0.5 0.5 0 ]
      children [
        Shape {
          appearance PBRAppearance { baseColor 0.1 0.8 0.9 roughness 1 metalness 0 }
          geometry Box { size 0.006 0.006 0.006 }
        }
      ]
    }

    # --- Front corners at 45 degrees (corner clearance while turning) ---
    DistanceSensor {
      translation 0.04 0.025 0.05
      rotation 0 0 1 0.7854
      name "ds_cl"
      type "laser"
      lookupTable [ 0 0 0, 0.5 0.5 0 ]
      children [
        Shape {
          appearance PBRAppearance { baseColor 0.1 0.8 0.9 roughness 1 metalness 0 }
          geometry Box { size 0.006 0.006 0.006 }
        }
      ]
    }
    DistanceSensor {
      translation 0.04 -0.025 0.05
      rotation 0 0 1 -0.7854
      name "ds_cr"
      type "laser"
      lookupTable [ 0 0 0, 0.5 0.5 0 ]
      children [
        Shape {
          appearance PBRAppearance { baseColor 0.1 0.8 0.9 roughness 1 metalness 0 }
          geometry Box { size 0.006 0.006 0.006 }
        }
      ]
    }

    # --- Sides at 90 degrees, mid-face above the wheels (beam at z 0.05 clears the wheel top at 0.04) ---
    DistanceSensor {
      translation 0 0.025 0.05
      rotation 0 0 1 1.5708
      name "ds_l"
      type "laser"
      lookupTable [ 0 0 0, 0.5 0.5 0 ]
      children [
        Shape {
          appearance PBRAppearance { baseColor 0.1 0.8 0.9 roughness 1 metalness 0 }
          geometry Box { size 0.006 0.006 0.006 }
        }
      ]
    }
    DistanceSensor {
      translation 0 -0.025 0.05
      rotation 0 0 1 -1.5708
      name "ds_r"
      type "laser"
      lookupTable [ 0 0 0, 0.5 0.5 0 ]
      children [
        Shape {
          appearance PBRAppearance { baseColor 0.1 0.8 0.9 roughness 1 metalness 0 }
          geometry Box { size 0.006 0.006 0.006 }
        }
      ]
    }

    # --- Two extra beams per side (about 67 and 113 degrees) closing the 45-degree holes between the corner, side and rear-corner beams ---
    DistanceSensor {
      translation 0.02 0.025 0.05
      rotation 0 0 1 1.1781
      name "ds_left_front"
      type "laser"
      lookupTable [ 0 0 0, 0.5 0.5 0 ]
      children [
        Shape {
          appearance PBRAppearance { baseColor 0.1 0.8 0.9 roughness 1 metalness 0 }
          geometry Box { size 0.006 0.006 0.006 }
        }
      ]
    }
    DistanceSensor {
      translation 0.02 -0.025 0.05
      rotation 0 0 1 -1.1781
      name "ds_right_front"
      type "laser"
      lookupTable [ 0 0 0, 0.5 0.5 0 ]
      children [
        Shape {
          appearance PBRAppearance { baseColor 0.1 0.8 0.9 roughness 1 metalness 0 }
          geometry Box { size 0.006 0.006 0.006 }
        }
      ]
    }


    DistanceSensor {
      translation -0.02 0.025 0.05
      rotation 0 0 1 1.9635
      name "ds_left_rear"
      type "laser"
      lookupTable [ 0 0 0, 0.5 0.5 0 ]
      children [
        Shape {
          appearance PBRAppearance { baseColor 0.1 0.8 0.9 roughness 1 metalness 0 }
          geometry Box { size 0.006 0.006 0.006 }
        }
      ]
    }
    DistanceSensor {
      translation -0.02 -0.025 0.05
      rotation 0 0 1 -1.9635
      name "ds_right_rear"
      type "laser"
      lookupTable [ 0 0 0, 0.5 0.5 0 ]
      children [
        Shape {
          appearance PBRAppearance { baseColor 0.1 0.8 0.9 roughness 1 metalness 0 }
          geometry Box { size 0.006 0.006 0.006 }
        }
      ]
    }

    # --- Rear beam + rear corners at 135 degrees (rear clearance when turning, backing out) ---
    DistanceSensor {
      translation -0.04 0 0.05
      rotation 0 0 1 3.1416
      name "ds_rear"
      type "laser"
      lookupTable [ 0 0 0, 0.5 0.5 0 ]
      children [
        Shape {
          appearance PBRAppearance { baseColor 0.1 0.8 0.9 roughness 1 metalness 0 }
          geometry Box { size 0.006 0.006 0.006 }
        }
      ]
    }
    DistanceSensor {
      translation -0.04 0.025 0.05
      rotation 0 0 1 2.3562
      name "ds_rear_left"
      type "laser"
      lookupTable [ 0 0 0, 0.5 0.5 0 ]
      children [
        Shape {
          appearance PBRAppearance { baseColor 0.1 0.8 0.9 roughness 1 metalness 0 }
          geometry Box { size 0.006 0.006 0.006 }
        }
      ]
    }
    DistanceSensor {
      translation -0.04 -0.025 0.05
      rotation 0 0 1 -2.3562
      name "ds_rear_right"
      type "laser"
      lookupTable [ 0 0 0, 0.5 0.5 0 ]
      children [
        Shape {
          appearance PBRAppearance { baseColor 0.1 0.8 0.9 roughness 1 metalness 0 }
          geometry Box { size 0.006 0.006 0.006 }
        }
      ]
    }

    # --- Absolute heading ---
    InertialUnit {
      translation 0 0 0.04
      name "imu"
      children [
        Shape {
          appearance PBRAppearance { baseColor 0.1 0.6 0.1 roughness 1 metalness 0 }
          geometry Box { size 0.01 0.01 0.004 }
        }
      ]
    }

    # --- Look-ahead camera: 32x24, 6 cm high, tilted 0.6 rad down, sees the floor 13-30 cm ahead of the robot centre (the next maze cell) ---
    Camera {
      translation 0.042 0 0.06
      rotation 0 1 0 0.6
      name "look_cam"
      width 32
      height 24
      fieldOfView 1.0
      children [
        Shape {
          appearance PBRAppearance { baseColor 0.9 0.9 0.1 roughness 1 metalness 0 }
          geometry Box { size 0.006 0.012 0.012 }
        }
      ]
    }

    # --- 1x1 downward camera = floor colour sensor (just past the chassis
    #     front face, at mid-chassis height, so it sees the floor and not the roof) ---
    Camera {
      translation 0.045 0 0.04
      rotation 0 1 0 1.5708
      name "floor_cam"
      width 1
      height 1
      fieldOfView 0.2
      near 0.005
      children [
        Shape {
          appearance PBRAppearance { baseColor 0.9 0.9 0.1 roughness 1 metalness 0 }
          geometry Box { size 0.006 0.012 0.012 }
        }
      ]
    }
  ]
] {
  Robot {
    translation IS translation
    rotation IS rotation
    name IS name
    controller IS controller
    controllerArgs IS controllerArgs
    supervisor FALSE
    children [
      # --- Chassis (cosmetic color only, dimensions locked) ---
      Transform {
        translation 0 0 0.04
        children [
          Shape {
            appearance PBRAppearance {
              baseColor IS bodyColor
              roughness 1
              metalness 0
            }
            geometry Box {
              size 0.08 0.05 0.03
            }
          }
        ]
      }

      # --- Left wheel (moved 10 mm forward, as rulebook 4.4 allows for balance: puts the centre of gravity 10 mm behind the axle so braking cannot tip the robot onto its nose) ---
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          anchor 0.01 0.032 0.02
        }
        device [
          RotationalMotor {
            name "left_wheel_motor"
          }
          PositionSensor {
            name "left_wheel_sensor"
          }
        ]
        endPoint Solid {
          translation 0.01 0.032 0.02
          rotation 1 0 0 1.5708
          children [
            Shape {
              appearance PBRAppearance {
                baseColor 0.05 0.05 0.05
                roughness 1
                metalness 0
              }
              geometry Cylinder {
                height 0.01
                radius 0.02
              }
            }
          ]
          name "left_wheel"
          boundingObject Cylinder {
            height 0.01
            radius 0.02
          }
          physics Physics {
            density -1
            mass 0.01
          }
        }
      }

      # --- Right wheel (same 10 mm forward position) ---
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          anchor 0.01 -0.032 0.02
        }
        device [
          RotationalMotor {
            name "right_wheel_motor"
          }
          PositionSensor {
            name "right_wheel_sensor"
          }
        ]
        endPoint Solid {
          translation 0.01 -0.032 0.02
          rotation 1 0 0 1.5708
          children [
            Shape {
              appearance PBRAppearance {
                baseColor 0.05 0.05 0.05
                roughness 1
                metalness 0
              }
              geometry Cylinder {
                height 0.01
                radius 0.02
              }
            }
          ]
          name "right_wheel"
          boundingObject Cylinder {
            height 0.01
            radius 0.02
          }
          physics Physics {
            density -1
            mass 0.01
          }
        }
      }

      # --- Rear caster ball (passive third contact point for stability) ---
      Transform {
        translation -0.03 0 0.008
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.3 0.3 0.3
              roughness 1
              metalness 0
            }
            geometry Sphere {
              radius 0.008
            }
          }
        ]
      }

      # --- Required status LEDs (fixed device names: led_blue / led_green) ---
      LED {
        translation 0.02 0.012 0.06
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0 0 0
              emissiveColor 0 0 1
              roughness 1
              metalness 0
            }
            geometry Sphere {
              radius 0.005
            }
          }
        ]
        name "led_blue"
        color [
          0 0 1
        ]
      }
      LED {
        translation 0.02 -0.012 0.06
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0 0 0
              emissiveColor 0 1 0
              roughness 1
              metalness 0
            }
            geometry Sphere {
              radius 0.005
            }
          }
        ]
        name "led_green"
        color [
          0 1 0
        ]
      }

      # --- Open slot: teams add their own sensors/parts here ---
      Group {
        children IS extensionSlot
      }
    ]
    boundingObject Group {
      children [
        Transform {
          translation 0 0 0.04
          children [
            Box {
              size 0.08 0.05 0.03
            }
          ]
        }
        Transform {
          translation -0.03 0 0.008
          children [
            Sphere {
              radius 0.008
            }
          ]
        }
      ]
    }
    physics Physics {
      density -1
      mass 0.15
    }
  }
}
